name: Finalize Friends UI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Finalize friends UI')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch friends entry point
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/page.tsx')
          text = path.read_text()

          old_button = '<IconButton label="New conversation" onClick={() => setActiveId(null)}><Plus size={18} /></IconButton>'
          new_button = '<Link href="/connections" aria-label="Add friends" title="Add friends" className="flex h-9 w-9 items-center justify-center rounded-xl text-white/35 transition hover:bg-white/[.07] hover:text-white"><UserPlus size={18} /></Link>'

          if old_button not in text:
              raise SystemExit('Could not find the existing plus button.')

          text = text.replace(old_button, new_button, 1)

          old_tabs = '<div className="mt-3 flex gap-1 overflow-auto">{(["inbox","starred","saved","archive"] as Tab[]).map(t => <button key={t} onClick={() => setTab(t)} className={`shrink-0 rounded-lg px-2.5 py-1.5 text-[9px] ${tab === t ? "bg-white/10" : "text-white/25"}`}>{t[0].toUpperCase()+t.slice(1)}</button>)}</div></div><div className="min-h-0 flex-1 overflow-auto p-2">'
          new_tabs = '<div className="mt-3 flex gap-1 overflow-auto">{(["inbox","starred","saved","archive"] as Tab[]).map(t => <button key={t} onClick={() => setTab(t)} className={`shrink-0 rounded-lg px-2.5 py-1.5 text-[9px] ${tab === t ? "bg-white/10" : "text-white/25"}`}>{t[0].toUpperCase()+t.slice(1)}</button>)}</div></div><Link href="/connections" className="mx-3 mt-3 flex items-center gap-3 rounded-2xl border border-cyan-300/10 bg-cyan-300/[.035] p-3 transition hover:border-cyan-300/20 hover:bg-cyan-300/[.06]"><span className="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-cyan-300/[.08] text-cyan-200/75"><UserPlus size={15} /></span><span className="min-w-0 flex-1"><span className="block text-xs font-semibold text-white/75">Add friends</span><span className="mt-0.5 block truncate text-[10px] text-white/25">Find people, send requests, accept or decline.</span></span><ChevronRight size={14} className="text-white/20" /></Link><div className="min-h-0 flex-1 overflow-auto p-2">'

          if old_tabs not in text:
              raise SystemExit('Could not find the sidebar tabs block.')

          text = text.replace(old_tabs, new_tabs, 1)
          path.write_text(text)
          PY

      - name: Commit patched UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Finalize friends UI"
          git push
