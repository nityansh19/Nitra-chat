name: Nitra Chat Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: One-time logout repair
        if: github.event_name == 'push' && github.event.head_commit.message == 'chore: finalize logout fix'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()
          s = s.replace(
              'import { loginWithFirebase, registerWithFirebase } from "@/lib/firebase-auth";',
              'import { loginWithFirebase, logoutFromFirebase, registerWithFirebase } from "@/lib/firebase-auth";'
          )
          if 'async function handleLogout()' not in s:
              s = s.replace(
                  'function Home() {\n',
                  '''function Home() {\n  async function handleLogout() {\n    try {\n      await logoutFromFirebase();\n    } catch {\n      // Clear the local session even if Firebase is temporarily unreachable.\n    }\n    localStorage.removeItem("nitra-demo-user");\n    setUser(null);\n  }\n''',
                  1,
              )
          if 'aria-label="Log out of Nitra"' not in s:
              home = s.find('function Home() {')
              main = s.find('return <main', home)
              end = s.find('>', main)
              if home == -1 or main == -1 or end == -1:
                  raise SystemExit('Could not locate Home main element')
              button = '''\n    <button\n      type="button"\n      onClick={handleLogout}\n      aria-label="Log out of Nitra"\n      title="Log out"\n      className="fixed bottom-4 right-4 z-[100] flex h-10 items-center gap-2 rounded-xl border border-red-400/15 bg-[#11131a]/95 px-3 text-[10px] font-medium text-red-200/70 shadow-2xl backdrop-blur-xl transition hover:border-red-400/30 hover:bg-red-400/[.08] hover:text-red-100 sm:bottom-5 sm:right-6"\n    >\n      <span className="h-1.5 w-1.5 rounded-full bg-red-300/80" />\n      Log out\n    </button>\n'''
              s = s[:end + 1] + button + s[end + 1:]
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-logout.yml .github/workflows/repair-logout-patch.yml .github/workflows/finalize-logout.yml || true
          git add src/app/page.tsx .github/workflows/build.yml
          git commit --amend --no-edit
          git push --force-with-lease
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
