name: Repair message navigation

on: push

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply repair
        run: python scripts/repair-message-navigation.py
      - name: Commit repair
        run: |
          git config user.name "Nityansh bahadur"
          git config user.email "118417867+Nityansh-19@users.noreply.github.com"
          rm -f scripts/repair-message-navigation.py .github/workflows/repair-message.yml .github/workflows/fix-message-navigation.yml .github/workflows/phase2-chat-ui.yml
          git checkout -- .github/workflows/build.yml
          git add src/app/page.tsx src/app/connections/page.tsx scripts/repair-message-navigation.py .github/workflows/repair-message.yml .github/workflows/fix-message-navigation.yml .github/workflows/phase2-chat-ui.yml .github/workflows/build.yml
          git commit -m "fix: open chat from friend message button"
          git push
