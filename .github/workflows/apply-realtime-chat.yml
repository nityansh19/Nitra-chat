name: Apply realtime chat fix

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix-realtime-chat.py
      - name: Build check
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit patch
        run: |
          git config user.name "nitra-bot"
          git config user.email "nitra-bot@users.noreply.github.com"
          git add src/app/page.tsx src/app/connections/page.tsx
          git commit -m "fix realtime Firebase message delivery"
          git push origin HEAD:main
