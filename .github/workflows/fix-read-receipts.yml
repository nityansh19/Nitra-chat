name: Fix Nitra Read Receipts

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-read-receipts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch read receipts
        shell: python
        run: |
          from pathlib import Path
          import re

          chat = Path('src/lib/firebase-chat.ts')
          s = chat.read_text()
          s = s.replace(
              'export type ChatMessage = { id: string; senderId: string; text: string; replyToId?: string; reactions?: Record<string, string[]>; editedAt?: unknown; deletedAt?: unknown; createdAt?: unknown };',
              'export type ChatMessage = { id: string; senderId: string; text: string; replyToId?: string; reactions?: Record<string, string[]>; editedAt?: unknown; deletedAt?: unknown; createdAt?: unknown; readAt?: unknown };'
          )
          old = '''export function subscribeToMessages(conversationId: string, callback: (items: ChatMessage[]) => void): Unsubscribe {\n  return onSnapshot(\n    query(collection(getFirebaseDb(), "conversations", conversationId, "messages"), orderBy("createdAt", "asc")),\n    (snapshot) => callback(snapshot.docs.map((item) => ({ id: item.id, ...(item.data() as Omit<ChatMessage, "id">) }))),\n  );\n}'''
          new = '''export function subscribeToMessages(conversationId: string, callback: (items: ChatMessage[]) => void): Unsubscribe {\n  return onSnapshot(\n    query(collection(getFirebaseDb(), "conversations", conversationId, "messages"), orderBy("createdAt", "asc")),\n    (snapshot) => {\n      const items = snapshot.docs.map((item) => ({ id: item.id, ...(item.data() as Omit<ChatMessage, "id">) }));\n      callback(items);\n\n      const authUser = getFirebaseAuth().currentUser;\n      if (!authUser) return;\n      const unreadIncoming = snapshot.docs.filter((item) => {\n        const data = item.data() as Omit<ChatMessage, "id">;\n        return data.senderId !== authUser.uid && !data.readAt;\n      });\n      void Promise.all(unreadIncoming.map((item) =>\n        updateDoc(doc(getFirebaseDb(), "conversations", conversationId, "messages", item.id), { readAt: serverTimestamp() })\n      )).catch(() => undefined);\n    },\n  );\n}'''
          if old not in s:
              raise SystemExit('subscribeToMessages block not found')
          chat.write_text(s.replace(old, new))

          rules = Path('firebase/firestore.rules')
          r = rules.read_text()
          old_rule = '''      allow update, delete: if isParticipant(conversationId)\n        && resource.data.senderId == request.auth.uid;'''
          new_rule = '''      allow update, delete: if isParticipant(conversationId)\n        && (\n          resource.data.senderId == request.auth.uid\n          || (\n            request.resource.data.diff(resource.data).affectedKeys().hasOnly(['readAt'])\n            && resource.data.senderId != request.auth.uid\n          )\n        );'''
          if old_rule not in r:
              raise SystemExit('message update rule not found')
          rules.write_text(r.replace(old_rule, new_rule))

          page = Path('src/app/page.tsx')
          p = page.read_text()
          p = p.replace(
              'type Message = { id: number; from: "me" | "them"; text: string; time: string; reactions?: string[] };',
              'type Message = { id: number; from: "me" | "them"; text: string; time: string; reactions?: string[]; read?: boolean };'
          )
          p = p.replace(
              '{mine && <CheckCheck size={11} />}',
              '{mine && <CheckCheck size={11} className={message.read ? "text-sky-400" : "text-white/30"} />}'
          )

          # Add read state when Firestore messages are mapped into the UI.
          pattern = r'(from: item\.senderId === user\.uid \? "me" : "them",\s*text: item\.text,\s*time: formatFirebaseTime\(item\.createdAt\))'
          replacement = r'\1,\n        read: Boolean(item.readAt),'
          p, n = re.subn(pattern, replacement, p, count=1)
          if n != 1:
              raise SystemExit('message mapping block not found')

          # Opening a chat should clear its local unread badge immediately.\n          # Realtime readAt updates then keep both browsers synchronized.
          p = p.replace(
              'setChats((prev) => prev.map((chat) => chat.id === active.id ? { ...chat, messages: mapped } : chat));',
              'setChats((prev) => prev.map((chat) => chat.id === active.id ? { ...chat, messages: mapped, unread: 0 } : chat));'
          )
          page.write_text(p)
      - name: Build check
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx src/lib/firebase-chat.ts firebase/firestore.rules
          git diff --cached --quiet || git commit -m "feat: add realtime read receipts"
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-read-receipts.yml
          git commit -m "chore: remove temporary read receipt workflow"
          git push
