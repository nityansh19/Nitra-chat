name: Fix logout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch logout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()

          s = s.replace(
              'import { loginWithFirebase, registerWithFirebase } from "@/lib/firebase-auth";',
              'import { loginWithFirebase, logoutFromFirebase, registerWithFirebase } from "@/lib/firebase-auth";'
          )

          marker = 'function Home() {\n'
          if marker not in s:
              raise SystemExit('Home marker not found')

          logout_fn = '''function Home() {\n  async function handleLogout() {\n    try {\n      await logoutFromFirebase();\n    } catch {\n      // Clear the local session even if Firebase sign-out encounters a network error.\n    }\n    localStorage.removeItem("nitra-demo-user");\n    setUser(null);\n  }\n'''

          if 'async function handleLogout()' not in s:
              s = s.replace(marker, logout_fn, 1)

          # Add a highly visible, fixed logout control inside Home. It is intentionally\n          # outside the chat panels so it remains accessible on both desktop and mobile.\n          anchor = '  return <main className='
          button = '''  return <main className="relative min-h-screen">\n    <button\n      type="button"\n      onClick={handleLogout}\n      aria-label="Log out of Nitra"\n      title="Log out"\n      className="fixed right-4 top-4 z-[100] flex h-10 items-center gap-2 rounded-xl border border-red-400/15 bg-[#11131a]/90 px-3 text-[10px] font-medium text-red-200/65 shadow-xl backdrop-blur-xl transition hover:border-red-400/30 hover:bg-red-400/[.08] hover:text-red-100 sm:right-6 sm:top-5"\n    >\n      <span className="h-1.5 w-1.5 rounded-full bg-red-300/70" />\n      Log out\n    </button>\n'''

          if 'aria-label="Log out of Nitra"' not in s:
              idx = s.find(anchor)
              if idx == -1:
                  raise SystemExit('Home return marker not found')
              # We need to preserve the existing <main ...> opening tag, so inject the button\n              # immediately after that opening tag rather than replacing it.\n              end = s.find('>', idx) + 1
              s = s[:end] + '\n' + button + s[end:]

          p.write_text(s)
          PY

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx .github/workflows/fix-logout.yml
          git rm .github/workflows/fix-logout.yml
          git commit -m "fix: make logout reliable and accessible"
          git push
