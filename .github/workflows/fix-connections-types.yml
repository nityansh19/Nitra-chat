name: Fix connections types

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix nullable profile entries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/app/connections/page.tsx")
          s = p.read_text()
          old = 'setProfiles((prev) => ({ ...prev, ...Object.fromEntries(entries.filter(([, profile]) => profile)) }));'
          new = 'setProfiles((prev) => ({ ...prev, ...Object.fromEntries(entries.filter(([, profile]): profile is UserProfile => profile !== null)) }));'
          if old not in s:
              raise SystemExit("Target line not found; refusing to change anything")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/connections/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix nullable profile type in connections"
          git push
